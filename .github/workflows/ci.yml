name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Dead Code Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dead code & unused translations audit
        run: node lint.js --deadcode-only

      - name: Full static analysis & linter
        run: node lint.js

      - name: Bundle and minify
        run: node build.js

      - name: Verify dist/ is up-to-date with source
        run: git diff --exit-code dist/
